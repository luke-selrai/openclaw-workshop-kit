# GraphQL Schema Reference
# ─────────────────────────────────────────────────────────────────────
# What's inside: a complete SDL schema for a User domain.
#   • Query / Mutation / Subscription roots
#   • Relay-style pagination: UserConnection, UserEdge, PageInfo
#   • Mutation payloads that return an errors: [UserError!] array (so a
#     failed mutation is a 200 with structured errors, not a transport error)
#   • Filter inputs (StringFilter, DateTimeFilter) and a custom DateTime scalar
# Copy this for any GraphQL contract; swap User for your entity and keep
# the Connection + payload-error patterns. Passes scripts/validate-api-spec.sh.
# ─────────────────────────────────────────────────────────────────────

type Query {
  user(id: ID!): User
  users(
    first: Int = 20
    after: String
    filter: UserFilter
  ): UserConnection!
  me: User
}

type Mutation {
  createUser(input: CreateUserInput!): CreateUserPayload!
  updateUser(id: ID!, input: UpdateUserInput!): UpdateUserPayload!
  deleteUser(id: ID!): DeleteUserPayload!
}

type Subscription {
  userCreated: User!
  userUpdated(id: ID): User!
}

type User {
  id: ID!
  email: String!
  name: String
  posts(first: Int = 10): PostConnection!
  createdAt: DateTime!
  updatedAt: DateTime
}

type Post {
  id: ID!
  title: String!
  body: String
  author: User!
  createdAt: DateTime!
}

# Relay-style connections for pagination
type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  cursor: String!
  node: User!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PostEdge {
  cursor: String!
  node: Post!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# Filters
input UserFilter {
  email: StringFilter
  createdAt: DateTimeFilter
}

input StringFilter {
  eq: String
  contains: String
  startsWith: String
}

input DateTimeFilter {
  after: DateTime
  before: DateTime
}

# Mutation inputs
input CreateUserInput {
  email: String!
  name: String
}

input UpdateUserInput {
  name: String
  email: String
}

# Mutation payloads with errors
type CreateUserPayload {
  user: User
  errors: [UserError!]
}

type UpdateUserPayload {
  user: User
  errors: [UserError!]
}

type DeleteUserPayload {
  deletedId: ID
  errors: [UserError!]
}

type UserError {
  field: String
  message: String!
  code: ErrorCode!
}

enum ErrorCode {
  VALIDATION_ERROR
  DUPLICATE_EMAIL
  NOT_FOUND
  UNAUTHORIZED
}

scalar DateTime
