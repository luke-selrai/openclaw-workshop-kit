; Reference OBS recording profile (Simple output mode) — recording-friendly defaults.
; This is a TEMPLATE for the settings to apply (via OBS → Settings → Output), or to
; copy into ~/.config/obs-studio/basic/profiles/<Name>/basic.ini on Linux WHILE OBS IS CLOSED,
; then select the profile in OBS (Profile menu).
;
; Portable across Linux/macOS/Windows because Simple mode abstracts the encoder.
; Key choices:
;   RecFormat2=hybrid_mp4  -> crash-safe AND edits losslessly in the video-editor pipeline
;   RecQuality=HQ          -> High Quality, Medium File Size (CRF-like)
;   RecEncoder=x264        -> software (universal); change to a hardware encoder for low CPU
;   FilenameFormatting     -> timestamped files, so clips sort in recording order
;
; For SEPARATE audio tracks (mic on 1, desktop on 2) you must use Advanced output
; mode (Mode=Advanced + [AdvOut] RecTracks=3 and assign sources to tracks) — encoder
; names there are OS-specific, so prefer setting that in the OBS UI.

[Output]
Mode=Simple
FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss

[SimpleOutput]
RecFormat2=hybrid_mp4
RecQuality=HQ
RecEncoder=x264
RecAudioEncoder=aac
ABitrate=160
RecTracks=1

[Audio]
SampleRate=48000
