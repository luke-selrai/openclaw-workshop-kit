name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff the PR / push commit range

      # Use the gitleaks CLI directly. The gitleaks-action requires a GITLEAKS_LICENSE
      # secret for org repos and fails on fresh clones; the CLI is always free.
      - name: Install gitleaks (pinned + sha256 verified)
        run: |
          set -e
          VER=8.30.1
          TARBALL=gitleaks_${VER}_linux_x64.tar.gz
          # sha256 of the linux_x64 tarball from the published gitleaks ${VER} checksums.
          EXPECTED=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${TARBALL}" -o "$TARBALL"
          echo "${EXPECTED}  ${TARBALL}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$TARBALL" gitleaks
          gitleaks version

      # Diff-scoped scan: only the commits this PR / push introduces. This guards against
      # NEW secrets without choking on either (a) the historical committed Framer MCP secret
      # (handled by provider-side rotation; git history is not rewritten, a standing founder
      # decision) or (b) the pre-existing teaching-example / downloaded-template matches under
      # skills/** (n8n community templates, connector doc examples, placeholder tokens). Those
      # are out of this gate's scope by design; the gate's job is to stop the next real leak.
      - name: gitleaks (scan only this change's commits)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -e
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1" # no base ref available; scan just the latest commit
          else
            RANGE="${BASE}..${HEAD}"
          fi
          echo "Scanning range: $RANGE"
          gitleaks detect --source . --redact --no-banner --log-opts="$RANGE"
