name: audit-skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/audit-skills.yml"
      - "README.md"
      - "docs/**"
      - "visuals/**"
      - "my-assistant/**"
      - ".claude-plugin/**"
  push:
    branches:
      - main

# Required so the auto-fix step on main can commit + push count corrections.
permissions:
  contents: write

# Serialise main pushes so a second concurrent push doesn't race the first
# auto-fix commit. PRs run independently (group keyed on PR number/ref).
concurrency:
  group: audit-skills-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PR check: read-only. Authors run `node scripts/audit-skills.mjs --write`
      # locally and commit the result before opening the PR.
      - name: Audit skill counts (PR check)
        if: github.event_name == 'pull_request'
        run: node scripts/audit-skills.mjs --check

      # Main auto-fix: regenerate counts on push to main and auto-commit any
      # drift. Closes the race where two skill-adding PRs squash-merge in
      # close succession and each PR's count-bump was based on the same now-
      # stale baseline. The audit script runs deterministically off the on-
      # disk skills/* tree, so the regenerated state is always correct.
      #
      # The auto-commit message includes [skip ci] to avoid re-triggering this
      # workflow on the auto-fix push (the rerun would be a no-op since the
      # tree is now drift-free, but skipping saves CI minutes).
      - name: Audit skill counts (main auto-fix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if node scripts/audit-skills.mjs --check; then
            echo "::notice::No skill-count drift on main."
            exit 0
          fi

          echo "Drift detected — regenerating counts."
          node scripts/audit-skills.mjs --write

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::audit --check failed but --write produced no changes — investigate."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(audit-skills): auto-fix skill-count drift after concurrent merges

          [skip ci]"
          git push
          echo "::notice::Auto-fixed skill-count drift on main and pushed correction."

      # Loup-conform invariants (PRD #385 / slice #386): assert no stale
      # legacy kit-home path reference survives and the bootstrap prompt stays
      # byte-identical across its in-repo copies. Read-only; runs on every event
      # so a stale straggler can't reach an attendee live.
      - name: Verify Loup-conform invariants
        run: node scripts/verify-conform.mjs

      - name: Test conform checker (regression)
        run: node scripts/test-verify-conform.mjs

      # Resilient-install invariants (PRD #385 / slice #388): assert the
      # bootstrap's failure-recovery loop (hard-stop, real output shown, re-mint
      # fix, no retry cap, no human-escalation wording) stays intact in both
      # in-repo copies. Read-only; runs on every event.
      - name: Verify resilient-install invariants
        run: node scripts/check-resilient-install.mjs

      - name: Test resilient-install checker (regression)
        run: node scripts/test-resilient-install.mjs
