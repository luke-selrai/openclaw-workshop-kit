name: audit-skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/audit-skills.yml"
      - "README.md"
      - "docs/**"
      - "visuals/**"
      - "my-assistant/**"
      - ".claude-plugin/**"
  push:
    branches:
      - main

# Required so the auto-fix step on main can commit + push count corrections.
permissions:
  contents: write

# Serialise main pushes so a second concurrent push doesn't race the first
# auto-fix commit. PRs run independently (group keyed on PR number/ref).
concurrency:
  group: audit-skills-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PR check: read-only. Authors run `node scripts/audit-skills.mjs --write`
      # locally and commit the result before opening the PR.
      - name: Audit skill counts (PR check)
        if: github.event_name == 'pull_request'
        run: node scripts/audit-skills.mjs --check

      # Main auto-fix: regenerate counts on push to main and auto-commit any
      # drift. Closes the race where two skill-adding PRs squash-merge in
      # close succession and each PR's count-bump was based on the same now-
      # stale baseline. The audit script runs deterministically off the on-
      # disk skills/* tree, so the regenerated state is always correct.
      #
      # The auto-commit message includes [skip ci] to avoid re-triggering this
      # workflow on the auto-fix push (the rerun would be a no-op since the
      # tree is now drift-free, but skipping saves CI minutes).
      - name: Audit skill counts (main auto-fix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if node scripts/audit-skills.mjs --check; then
            echo "::notice::No skill-count drift on main."
            exit 0
          fi

          echo "Drift detected — regenerating counts."
          node scripts/audit-skills.mjs --write

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::audit --check failed but --write produced no changes — investigate."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(audit-skills): auto-fix skill-count drift after concurrent merges

          [skip ci]"
          git push
          echo "::notice::Auto-fixed skill-count drift on main and pushed correction."

      # Install-canon invariants (PRD #385 / slice #386, redesigned against
      # ADR-0001 by CORE-116): assert no old-canon install reference survives
      # (hardcoded kit home, dead workspace folder, dead first-run marker), that
      # docs/start still carries exactly one install document, and that the
      # pasted prompt holds the two-door canon and produces the pointer block,
      # persona copy and manifest. Read-only; runs on every event so a stale
      # straggler can't reach an attendee live.
      - name: Verify install-canon invariants
        run: node scripts/verify-conform.mjs

      # Description-budget rule (CORE-93, enforcing since CORE-98): the
      # >500-char and first/second-person rules over every skill description
      # hard-fail the `--check` step above for any first-party skill. This
      # regression test is what proves the rule actually fires — it exercises
      # enforcing mode against fixtures, proves a lock-pinned skill is exempted
      # but still reported, and asserts the real library has zero failures.
      - name: Test description-budget rule (regression)
        run: node scripts/test-description-budget.mjs

      - name: Test conform checker (regression)
        run: node scripts/test-verify-conform.mjs

      # Count-free rule (CORE-116): docs/start/setup.md must carry neither a
      # skills-audit marker nor a hard skill count, so the pasted prompt can
      # never drift from the markers. The rule stands in for an absence, so the
      # seeded fixture is what proves it fires.
      - name: Test count-free rule (regression)
        run: node scripts/test-count-free.mjs

      # Resilient-install invariants (PRD #385 / slice #388): assert the
      # bootstrap's failure-recovery loop (hard-stop, real output shown, re-mint
      # fix, no retry cap, no human-escalation wording) stays intact in both
      # in-repo copies. Read-only; runs on every event.
      - name: Verify resilient-install invariants
        run: node scripts/check-resilient-install.mjs

      - name: Test resilient-install checker (regression)
        run: node scripts/test-resilient-install.mjs

      # Install-narration invariants (LOUP-20): assert the venue-wifi contract
      # (preflight, "looks frozen" warning, generous timeouts, fail-loudly,
      # confirm-after) stays intact in the bootstrap copies, first-run-setup,
      # and the kit CLAUDE.md rule. Read-only; runs on every event.
      - name: Verify install-narration invariants
        run: node scripts/check-install-narration.mjs

      - name: Test install-narration checker (regression)
        run: node scripts/test-install-narration.mjs

      # Matt Pocock skills-install contract (LOUP-19): assert first-run-setup
      # Step 3 keeps current upstream skill names, on-disk verification, the
      # self-heal (list → resolve renames → retry) pass, and the honest
      # per-skill summary. --live also lists the live mattpocock/skills repo,
      # so CI goes red at the next upstream rename instead of attendees
      # silently losing skills. Read-only; runs on every event.
      - name: Verify MP skills-install contract (incl. live upstream)
        run: node scripts/check-mp-skills-install.mjs --live

      - name: Test MP skills-install checker (regression)
        run: node scripts/test-mp-skills-install.mjs
